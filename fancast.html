<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Fancast 教程</title>
    <style>
        /* reset & base */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-width: 320px;
            max-width: 540px;
            margin: 0 auto;
            font-size: 16px;
            font-family: -apple-system, Helvetica, sans-serif;
            line-height: 1.5;
            color: #000;
            background: #fff;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: none;
            padding: 12px 16px 30px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        a {
            text-decoration: none;
            color: #0066cc;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        ul,
        ol {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        p {
            margin: 0 0 0.6em 0;
            padding: 4px 0;
        }
        
        h2 {
            margin: 1.2em 0 0.4em 0;
            padding: 6px 0 4px 0;
            font-size: 1.4rem;
            border-bottom: 1px solid #eaeaea;
        }
        
        h3 {
            margin: 1em 0 0.3em 0;
            font-size: 1.2rem;
        }
        
        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 8px 0 12px 0;
            border-radius: 8px;
            background: #f5f5f5;
        }
        
        .red {
            color: #c00;
            font-weight: 600;
        }
        
        .blue {
            color: #0a6b3f;
            font-weight: 500;
        }
        /* 目录卡片 */
        
        .toc {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px 18px;
            margin: 10px 0 24px 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef2f6;
        }
        
        .toc-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1e293b;
        }
        
        .toc-item {
            display: block;
            padding: 8px 6px 8px 12px;
            margin: 4px 0;
            border-radius: 10px;
            background: white;
            border-left: 4px solid #3b82f6;
            font-weight: 500;
            color: #0b1e33;
            transition: background 0.1s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        
        .toc-item:active {
            background: #e6eff9;
        }
        
        .toc-item i {
            font-style: normal;
            margin-right: 6px;
            opacity: 0.6;
        }
        
        .section-anchor {
            scroll-margin-top: 12px;
        }
        
        .badge {
            background: #dbeafe;
            color: #1e4f8a;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-left: 6px;
        }
        /* 回到顶部小链接 */
        
        .back-top-link {
            font-size: 0.75rem;
            font-weight: 400;
            margin-left: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 0 8px;
            border-radius: 30px;
            white-space: nowrap;
            transition: background 0.1s;
            text-decoration: none;
            display: inline-block;
            line-height: 1.6;
        }
        
        .back-top-link:hover {
            background: #dce3ed;
            text-decoration: none;
        }
        
        h2 .back-top-link {
            vertical-align: middle;
        }
        
        hr {
            margin: 20px 0 8px 0;
            border: none;
            border-top: 1px dashed #d0d8e0;
        }
        
        .inline-link {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 14px;
            font-size: 0.9rem;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <!-- ====== 目录 (点击跳转) ====== -->
    <div class="toc">
        <div class="toc-title">目录 · 点击跳转</div>
        <a href="#anchor-phone" class="toc-item"><i></i> 手机攒票投票教程（不能多开）</a>
        <a href="#anchor-pc" class="toc-item"><i></i> 电脑攒票投票教程（可以多开）</a>
    </div>

    <!-- ====== 内容区块 ====== -->

    <!-- 1. 手机攒票投票 -->
    <h2 id="anchor-phone" class="section-anchor">
        手机攒票投票教程 <span class="badge">不能多开</span>
        <a href="#top" class="back-top-link">↑ 回顶</a>
    </h2>
    <img src="images/fancast1.jpg" alt="fancast1" width="100%">
    <img src="images/fancast2.jpg" alt="fancast2" width="100%">
    <img src="images/fancast3.jpg" alt="fancast3" width="100%">
    <img src="images/fancast12.jpg" alt="fancast12" width="100%">
    <img src="images/fancast13.jpg" alt="fancast13" width="100%">
    <img src="images/fancast11.jpg" alt="fancast11" width="100%">
    <img src="images/fancast6.jpg" alt="fancast6" width="100%">
    <img src="images/fancast7.jpg" alt="fancast7" width="100%">
    <img src="images/fancast8.jpg" alt="fancast8" width="100%">
    <img src="images/fancast9.jpg" alt="fancast9" width="100%">
    <img src="images/fancast10.jpg" alt="fancast10" width="100%">
    <p>潘站教程：<a href="https://weibo.com/6931593512/5052160024251342" target="_blank">https://weibo.com/6931593512/5052160024251342</a></p>

    <!-- 2. 电脑攒票投票（多开） -->
    <h2 id="anchor-pc" class="section-anchor">
        电脑端 Fancast 多开教程 <span class="badge">可多开</span>
        <a href="#top" class="back-top-link">↑ 回顶</a>
    </h2>
    <p class="red">以下为电脑端 fancast 多开教程（由于手机多开无广告，有电脑的可以按以下方法攒票）</p>
    <img src="images/F1.jpg" alt="F1" width="100%">
    <img src="images/F2.jpg" alt="F2" width="100%">
    <img src="images/F3.jpg" alt="F3" width="100%">
    <img src="images/F4.jpg" alt="F4" width="100%">
    <img src="images/F5.jpg" alt="F5" width="100%">

    <!-- 底部导航 -->
    <hr>
    <div style="display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 8px 0; font-size: 0.9rem;">
        <a href="#anchor-phone">手机攒票</a>
        <a href="#anchor-pc">电脑多开</a>
        <a href="#top" style="margin-left: auto;">↑ 顶部</a>
    </div>
    <p style="color: #6b7a8d; font-size: 0.85rem; margin-top: 8px;">点击目录或底部链接，平滑跳转至对应板块。</p>

    <!-- 返回直接回到上一页（不保留锚点历史） -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 拦截所有锚点链接，不产生历史记录
            document.querySelectorAll('a[href^="#"]').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href');
                    if (targetId === '#top' || targetId === '#') {
                        window.scrollTo({
                            top: 0,
                            behavior: 'smooth'
                        });
                    } else {
                        const target = document.querySelector(targetId);
                        if (target) {
                            target.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                        }
                    }
                    // 清除地址栏 hash，不增加历史记录
                    history.replaceState(null, null, window.location.pathname);
                });
            });
        });
    </script>

</body>

</html>
